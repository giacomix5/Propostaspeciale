<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una domanda importante dal tuo salamino tipo Milano❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 90%;
      position: relative;
    }
    h1 {
      color: #d63384;
      font-size: 1.8rem;
      margin-bottom: 25px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
      min-height: 50px;
    }
    button {
      padding: 12px 25px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    #btn-yes {
      background-color: #28a745;
      color: white;
    }
    #btn-yes:hover {
      background-color: #218838;
      transform: scale(1.05);
    }
    #btn-no {
      background-color: #dc3545;
      color: white;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
  </style>
  <!-- Libreria per i coriandoli -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="card" id="main-card">
    <h1 id="question">Alis vuoi essere la mia ragazza, e salamina tipo Milano?❤️</h1>
    <div class="buttons">
      <button id="btn-yes">SI!</button>
      <button id="btn-no">No</button>
    </div>
  </div>

  <script>
    const btnNo = document.getElementById('btn-no');
    const btnYes = document.getElementById('btn-yes');
    const question = document.getElementById('question');

    // Funzione per far scappare il pulsante "No"
    function moveButton(e) {
      if (e && e.type === 'touchstart') {
        e.preventDefault(); // Evita il click accidentale su smartphone
      }
      
      const padding = 20;
      const maxX = window.innerWidth - btnNo.offsetWidth - padding;
      const maxY = window.innerHeight - btnNo.offsetHeight - padding;
      
      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding, Math.random() * maxY);
      
      btnNo.style.position = 'fixed';
      btnNo.style.left = `${x}px`;
      btnNo.style.top = `${y}px`;
    }

    btnNo.addEventListener('mouseover', moveButton);
    btnNo.addEventListener('touchstart', moveButton, { passive: false }); // Per smartphone

    // Cosa succede quando clicca "Sì"
    btnYes.addEventListener('click', () => {
      question.innerHTML = "Sapevo che avresti detto di sì!🎉❤️<br><br>🫵🏻Sei la mia ragazza❤️ amore della mia vita❤️🫵🏻";
      btnYes.classList.add('hidden');
      btnNo.classList.add('hidden');

      // Effetto coriandoli
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    });
  </script>
</body>
</html>
